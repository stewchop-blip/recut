name: Script Video V3 Check

on:
  pull_request:
    paths:
      - "app/services/script_video/**"
      - "app/bot/handlers/script_video.py"
      - "app/bot/handlers/start.py"
      - "app/bot/middlewares/render_queue.py"
      - "app/services/subtitles/scene_adapter.py"
      - "tests/test_script_video*.py"
      - "pyproject.toml"
      - ".github/workflows/script-video-v3-check.yml"
      - "Dockerfile.hyperframes"
      - ".github/workflows/hyperframes-docker-smoke.yml"
  push:
    branches:
      - "main"
      - "feature/script-video-v3-active2"
      - "stabilize/script-video-v3-cost-safety"
    paths:
      - "app/services/script_video/**"
      - "app/bot/handlers/script_video.py"
      - "app/bot/handlers/start.py"
      - "app/bot/middlewares/render_queue.py"
      - "app/services/subtitles/scene_adapter.py"
      - "tests/test_script_video*.py"
      - "pyproject.toml"
      - ".github/workflows/script-video-v3-check.yml"
      - "Dockerfile.hyperframes"
      - ".github/workflows/hyperframes-docker-smoke.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: "123456:test-token"
      OPENROUTER_API_KEY: "test-openrouter-key"
      DATABASE_URL: "postgresql+asyncpg://recut:recut@localhost:5432/recut"
      ENVIRONMENT: development
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install focused test dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install
          pytest pytest-asyncio httpx pydantic pydantic-settings python-dotenv
          structlog edge-tts aiogram sqlalchemy asyncpg greenlet pillow "av>=11,<18"
      - name: Compile changed Python modules
        run: python -m compileall -q app/services/script_video app/bot/handlers/script_video.py app/bot/handlers/start.py app/bot/middlewares/render_queue.py app/services/subtitles/scene_adapter.py tests/test_script_video.py tests/test_script_video_v3.py tests/test_script_video_hyperframes.py
      - name: Verify shared render admission imports
        run: >-
          python -c "from app.bot.handlers.script_video import _script_render_semaphore; from app.bot.middlewares.render_queue import RenderQueueMiddleware; assert RenderQueueMiddleware()._semaphore is _script_render_semaphore"
      - name: Run focused script-video tests
        run: python -m pytest -q tests/test_script_video.py tests/test_script_video_v3.py tests/test_script_video_hyperframes.py

  container-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact optional ReCut pilot image
        run: docker build --pull -f Dockerfile.hyperframes -t recut-hyperframes-smoke .
      - name: Record image size
        run: |
          docker image inspect recut-hyperframes-smoke \
            --format 'image_bytes={{.Size}} image_id={{.Id}}'
      - name: Render in restricted offline container with live RAM measurements
        run: |
          docker run --rm -i --network none --memory 1024m --cpus 2 \
            --pids-limit 160 --shm-size 256m \
            -e TELEGRAM_BOT_TOKEN='123456:fake-test-token' \
            -e OPENROUTER_API_KEY='not-an-api-key' \
            -e DATABASE_URL='postgresql+asyncpg://fake:fake@localhost:5432/unused' \
            -e SCRIPT_VIDEO_HYPERFRAMES_ENABLED='true' \
            -e HYPERFRAMES_NO_TELEMETRY=1 -e DO_NOT_TRACK=1 \
            --entrypoint python recut-hyperframes-smoke - <<'PY'
          import asyncio
          import json
          import time
          from pathlib import Path
          import psutil
          from app.services.script_video.hyperframes_graphics import HyperframesGraphicRenderer
          from app.services.script_video.assembly import ScriptVideoAssembler

          async def run():
              workdir = Path('/tmp/recut-hyperframes-container-smoke')
              workdir.mkdir(parents=True, exist_ok=True)
              renderer = HyperframesGraphicRenderer(enabled=True)
              assert renderer.available, 'CLI unavailable in optional Docker image'
              parent = psutil.Process()
              started = time.monotonic()
              job = asyncio.create_task(renderer.render_scene(
                  title='Почему откладываем дела',
                  narration='Мы откладываем важные задачи, когда кажется, что начать слишком трудно.',
                  duration=2.4, workdir=workdir, index=0,
              ))
              peak_rss = 0
              while not job.done():
                  try:
                      related = [parent] + parent.children(recursive=True)
                      rss = sum(p.memory_info().rss for p in related if p.is_running())
                      peak_rss = max(rss, rss)
                  except psutil.Error:
                      pass
                  await asyncio.sleep(0.2)
              result = await job
              if result is None:
                  raise RuntimeError('Real HyperFrames adapter returned fallback in pilot image')
              duration = await ScriptVideoAssembler.audio_duration(result)
              elapsed = time.monotonic() - started
              assert 2.0 < duration < 2.9, duration
              assert result.stat().st_size > 1024
              print(json.dumps({
                  'render_elapsed_seconds': round(elapsed, 2),
                  'approx_process_tree_peak_rss_mb': round(peak_rss / 1048576, 1),
                  'render_bytes': result.stat().st_size,
                  'video_duration': round(duration, 3),
              }))
          asyncio.run(run())
          PY
