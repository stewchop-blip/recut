name: ReCut PRO Stars Check

on:
  pull_request:
    paths:
      - "app/services/subscriptions.py"
      - "app/bot/handlers/payments.py"
      - "app/database/models.py"
      - "app/services/generations.py"
      - "app/core/config.py"
      - "tests/test_pro_subscriptions.py"
      - ".github/workflows/pro-stars-check.yml"

jobs:
  subscription-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install "pytest>=8" "pytest-asyncio>=0.23" "sqlalchemy>=2,<3" "aiosqlite>=0.19" "greenlet>=3" "aiogram>=3.13,<4"
      - name: Syntax check
        run: |
          python -m compileall -q app/services/subscriptions.py app/bot/handlers/payments.py app/database/models.py app/services/generations.py app/bot/handlers/script_video.py app/bot/keyboards/inline.py app/core/config.py tests/test_pro_subscriptions.py
      - name: Verify Telegram Stars subscription API support
        run: |
          python - <<'PY'
          from inspect import signature
          from aiogram import Bot
          assert "subscription_period" in signature(Bot.create_invoice_link).parameters
          assert "telegram_payment_charge_id" in signature(Bot.edit_user_star_subscription).parameters
          assert "is_canceled" in signature(Bot.edit_user_star_subscription).parameters
          PY
      - name: Subscription ledger tests
        run: python -m pytest -q tests/test_pro_subscriptions.py
