[project]
name = "recut"
version = "0.1.0"
description = "Telegram bot for text-to-voiceover (MVP v1)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Anton", email = "anton@example.com"}
]
dependencies = [
    # Telegram
    "aiogram>=3.13,<4",
    # HTTP clients
    "httpx>=0.27,<1",
    "aiohttp>=3.10,<4",
    # Database
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    # Config & validation
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    # Logging
    "structlog>=24.1,<25",
    # Utilities
    "python-ulid>=2.3,<4",
    "tenacity>=8.3,<9",
    "pytz>=2024.1,<2025",
    # Speech-to-text (stage D)
    "faster-whisper>=1.0,<2",
    # Memory guard (stage D)
    "psutil>=5.9,<7",
    # CTA overlay asset generation (stage I)
    "pillow>=10.0,<12",
    # URL video intake (TikTok / Instagram / YouTube)
    "yt-dlp>=2024.0.0,<2026",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-mock>=3.13,<4",
    "ruff>=0.5,<1",
    "mypy>=1.11,<2",
    "types-python-dotenv>=0.1,<1",
    "aiosqlite>=0.19,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PT", "Q", "ARG", "PL", "TRY",
]
ignore = []
exclude = [".git", "__pycache__", ".venv", "venv", "dist", "build", "*.egg-info"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
indent-width = 4

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]